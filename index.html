<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110d">
<meta name="description" content="Felt & Fortune — free Texas Hold'em with virtual chips for your friends. No sign-up, just share a room code.">
<title>Felt &amp; Fortune — Poker Night</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23d4af37%22/><circle cx=%2250%22 cy=%2250%22 r=%2232%22 fill=%22%230d4a35%22/><text x=%2250%22 y=%2264%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23f3ecd8%22>♠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#07110d;
  --bg-2:#0c1a14;
  --panel:#11211a;
  --panel-2:#162a21;
  --line:rgba(243,236,216,0.10);
  --line-2:rgba(243,236,216,0.18);
  --text:#f1ead7;
  --text-dim:#9cb0a5;
  --text-faint:#6d8378;
  --felt-1:#17704f;
  --felt-2:#0d4a35;
  --felt-3:#083425;
  --rail-1:#5b3a22;
  --rail-2:#2e1c10;
  --gold:#e0b84a;
  --gold-2:#c99a2e;
  --gold-dim:#8a7226;
  --cream:#fbf6e8;
  --ink:#1b1712;
  --red:#c0322a;
  --danger:#e05a4e;
  --ok:#4fb27a;
  --info:#5aa0d8;
  --shadow:0 18px 40px rgba(0,0,0,0.45);
  --radius:14px;
  --w:40px; /* default card width; card containers override it */
  color-scheme: dark;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); }
body{
  font-family:'DM Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  color:var(--text);
  overflow:hidden; position:fixed; inset:0;
  font-variant-numeric: tabular-nums;
}
button,input{ font-family:inherit; color:inherit; }
button{ cursor:pointer; }
button:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.display{ font-family:'Fraunces', Georgia, serif; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:14px 16px; border-radius:12px; border:1px solid transparent;
  font-size:15px; font-weight:700; letter-spacing:.2px;
  transition:transform .08s ease, filter .15s ease, background .15s ease, border-color .15s ease;
  user-select:none;
}
.btn:active:not(:disabled){ transform:scale(0.97); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn-gold{ background:linear-gradient(180deg,#f0cd66,var(--gold-2)); color:#2a1f03; box-shadow:0 6px 18px rgba(224,184,74,.25), inset 0 1px 0 rgba(255,255,255,.4); }
.btn-gold:hover:not(:disabled){ filter:brightness(1.06); }
.btn-ghost{ background:rgba(255,255,255,0.03); border-color:var(--line-2); }
.btn-ghost:hover:not(:disabled){ border-color:var(--gold-dim); background:rgba(255,255,255,0.06); }
.btn-fold{ background:rgba(224,90,78,.12); border-color:rgba(224,90,78,.55); color:#ffc2bb; }
.btn-call{ background:rgba(79,178,122,.16); border-color:rgba(79,178,122,.6); color:#c8f2d8; }
.btn-raise{ background:rgba(224,184,74,.14); border-color:rgba(224,184,74,.55); color:#f5d982; }
.btn small{ font-weight:500; opacity:.8; font-size:12px; }
.kbd{ display:none; font-size:10px; font-weight:600; opacity:.55; border:1px solid currentColor; border-radius:4px; padding:0 4px; }
@media (hover:hover) and (min-width:900px){ .kbd{ display:inline-block; } }
.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.03); border:1px solid var(--line-2);
  border-radius:10px; padding:8px 11px; font-size:13px; font-weight:500;
}
.icon-btn:hover{ border-color:var(--gold-dim); }
.icon-btn svg{ width:15px; height:15px; }
.icon-btn .lbl{ display:none; }
@media (min-width:560px){ .icon-btn .lbl{ display:inline; } }

/* ---------- toasts ---------- */
.toasts{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:min(92vw,420px); }
.toast{
  pointer-events:auto; background:var(--panel-2); border:1px solid var(--line-2); border-left:4px solid var(--info);
  color:var(--text); font-size:13.5px; padding:10px 14px; border-radius:10px; box-shadow:var(--shadow);
  animation:toastIn .22s ease both; max-width:100%;
}
.toast.error{ border-left-color:var(--danger); }
.toast.ok{ border-left-color:var(--ok); }
.toast.out{ animation:toastOut .2s ease both; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:none; } }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-8px);} }

/* ---------- LOBBY ---------- */
#lobby{
  height:100%; width:100%; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, rgba(23,112,79,0.35), transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(224,184,74,0.07), transparent 70%),
    var(--bg);
}
.lobby-card{
  width:100%; max-width:400px;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid var(--line);
  border-radius:20px; padding:28px 22px 22px; box-shadow:var(--shadow);
}
.brand{ text-align:center; margin-bottom:22px; }
.logo{ width:64px; height:64px; margin:0 auto 12px; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
.brand h1{ font-family:'Fraunces', Georgia, serif; font-weight:800; font-size:32px; margin:0 0 6px; letter-spacing:.2px; }
.brand h1 span{ color:var(--gold); }
.brand p{ margin:0; color:var(--text-dim); font-size:14px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; letter-spacing:.4px; text-transform:uppercase; }
.field input{
  width:100%; padding:13px 14px; font-size:16px;
  background:rgba(0,0,0,0.25); border:1px solid var(--line-2); border-radius:11px; outline:none;
  transition:border-color .15s ease, background .15s ease;
}
.field input:focus{ border-color:var(--gold); background:rgba(0,0,0,0.35); }
.field input.code{ text-transform:uppercase; letter-spacing:8px; font-weight:700; font-size:24px; text-align:center; font-family:'Fraunces', Georgia, serif; }
.field input.code::placeholder{ letter-spacing:8px; opacity:.35; }

.tabs{ display:grid; grid-template-columns:1fr 1fr; background:rgba(0,0,0,0.25); border:1px solid var(--line); border-radius:12px; padding:4px; margin:4px 0 16px; }
.tabs button{ background:transparent; border:none; padding:10px; border-radius:9px; font-weight:700; font-size:14px; color:var(--text-dim); }
.tabs button[aria-selected=true]{ background:var(--panel-2); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.35); }
.pane{ display:none; }
.pane.on{ display:block; animation:fadeIn .2s ease; }
.pane-note{ font-size:13px; color:var(--text-dim); margin:0 0 14px; line-height:1.5; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }

.lobby-msg{ min-height:18px; font-size:13px; color:var(--danger); margin-top:12px; text-align:center; line-height:1.45; }
.lobby-msg.info{ color:var(--text-dim); }
.lobby-status{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px; color:var(--text-faint); margin-top:8px; }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
.dot.ok{ background:var(--ok); box-shadow:0 0 0 3px rgba(79,178,122,.18); }
.dot.warn{ background:var(--gold); animation:blink 1s infinite; }
.dot.bad{ background:var(--danger); }
@keyframes blink{ 50%{ opacity:.35; } }
.resume-box{ display:none; margin-bottom:16px; padding:12px; border-radius:12px; border:1px dashed var(--gold-dim); background:rgba(224,184,74,0.05); }
.resume-box p{ margin:0 0 10px; font-size:13px; color:var(--text-dim); line-height:1.45; }
.resume-box .row{ display:flex; gap:8px; }
.lobby-foot{ font-size:12px; color:var(--text-faint); text-align:center; max-width:400px; line-height:1.5; }
.spinner{ width:16px; height:16px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- TABLE ---------- */
#table{ display:none; height:100%; width:100%; flex-direction:column; max-width:1200px; margin:0 auto; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  flex-shrink:0; z-index:20;
}
.room-chip{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); border:1px solid var(--line-2);
  border-radius:12px; padding:6px 12px 6px 10px; text-align:left;
}
.room-chip:hover{ border-color:var(--gold-dim); }
.room-chip .k{ font-size:10px; letter-spacing:1.2px; color:var(--text-faint); text-transform:uppercase; display:block; }
.room-chip b{ font-family:'Fraunces', Georgia, serif; color:var(--gold); letter-spacing:3px; font-size:17px; }
.game-info{ flex:1; text-align:center; font-size:11px; color:var(--text-dim); line-height:1.2; letter-spacing:.4px; text-transform:uppercase; font-weight:700; }
.game-info b{ display:block; color:var(--text); font-size:15px; letter-spacing:.5px; text-transform:none; }
.pot .total{ font-size:11px; color:var(--text-dim); font-weight:600; margin-left:4px; }
.real-hint{ font-size:13px; font-weight:600; color:var(--cream); background:rgba(0,0,0,.35); border:1px dashed rgba(224,184,74,.45); border-radius:999px; padding:5px 14px; }
.show-row{ display:flex; gap:6px; justify-content:center; margin-bottom:8px; }
.show-row span{ align-self:center; font-size:12px; color:var(--text-dim); margin-right:2px; }
.show-row button{ background:rgba(255,255,255,0.04); border:1px solid var(--line-2); border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:600; }
.show-row button:hover{ border-color:var(--gold-dim); }
.award{ background:rgba(0,0,0,.22); border:1px solid rgba(224,184,74,.35); border-radius:12px; padding:10px 12px 12px; margin-bottom:10px; }
.award h4{ margin:0 0 2px; font-size:14px; }
.award h4 b{ color:var(--gold); }
.award p{ margin:0 0 8px; font-size:12px; color:var(--text-dim); }
.award .names{ display:flex; flex-wrap:wrap; gap:6px; }
.award .names button{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.04); border:1.5px solid var(--line-2); border-radius:999px; padding:4px 12px 4px 4px; font-weight:700; font-size:13px; }
.award .names button .avatar{ width:24px; height:24px; font-size:11px; }
.award .names button.sel{ border-color:var(--gold); background:rgba(224,184,74,.16); }
.mode-pick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.mode-pick button{ text-align:left; background:rgba(0,0,0,.22); border:1.5px solid var(--line-2); border-radius:12px; padding:10px 11px; }
.mode-pick button b{ display:block; font-size:13.5px; margin-bottom:2px; }
.mode-pick button span{ font-size:11.5px; color:var(--text-dim); line-height:1.35; display:block; }
.mode-pick button[aria-pressed=true]{ border-color:var(--gold); background:rgba(224,184,74,.1); }
.drawer-tabs{ display:flex; gap:4px; }
.drawer-tabs button{ background:transparent; border:none; color:var(--text-dim); font-family:'Fraunces', Georgia, serif; font-size:17px; font-weight:600; padding:4px 8px; border-radius:8px; }
.drawer-tabs button[aria-selected=true]{ color:var(--text); background:rgba(255,255,255,.06); }
.ledger{ width:100%; border-collapse:collapse; font-size:13px; }
.ledger th{ text-align:right; font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--text-faint); padding:6px 4px; font-weight:700; }
.ledger th:first-child, .ledger td:first-child{ text-align:left; }
.ledger td{ text-align:right; padding:8px 4px; border-top:1px solid rgba(255,255,255,.05); color:var(--text); }
.ledger .up{ color:#7fe0a4; font-weight:700; }
.ledger .down{ color:#ff9d93; font-weight:700; }
.drawer-foot{ padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-dim); }
.switch{ position:relative; width:42px; height:24px; border-radius:999px; background:rgba(255,255,255,.12); border:none; padding:0; }
.switch::after{ content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s ease; }
.switch[aria-checked=true]{ background:var(--gold-2); }
.switch[aria-checked=true]::after{ transform:translateX(18px); }
@media (max-width:420px){ .game-info{ font-size:9.5px; } .game-info b{ font-size:12.5px; } }
.room-chip .host-badge{ font-size:10px; font-weight:700; color:#2a1f03; background:var(--gold); border-radius:6px; padding:2px 6px; margin-left:4px; letter-spacing:.5px; vertical-align:2px; }
.topbar-actions{ display:flex; gap:6px; }

.conn-bar{
  display:none; align-items:center; justify-content:space-between; gap:10px;
  margin:0 12px 6px; background:rgba(224,90,78,0.12); border:1px solid rgba(224,90,78,.5);
  border-radius:10px; padding:8px 12px; font-size:13px; flex-shrink:0; z-index:20;
}
.conn-bar.show{ display:flex; }
.conn-bar span{ display:flex; align-items:center; gap:8px; }
.conn-bar button{ background:var(--danger); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:700; flex-shrink:0; }

.felt-wrap{ flex:1; position:relative; min-height:0; margin:0 8px; }
.felt{
  position:absolute; inset:10px; border-radius:9999px;
  background:
    radial-gradient(ellipse 65% 55% at 50% 45%, var(--felt-1), var(--felt-2) 60%, var(--felt-3));
  border:12px solid var(--rail-1);
  box-shadow:
    0 0 0 2px #1a0f08,
    0 0 0 5px var(--rail-2),
    inset 0 0 0 2px rgba(224,184,74,.25),
    inset 0 0 70px rgba(0,0,0,.55),
    0 20px 50px rgba(0,0,0,.6);
  background-clip:padding-box;
}

.center-area{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px; width:min(92%, 420px); z-index:3;
  text-align:center;
}
.stage-label{ font-size:11px; font-weight:700; letter-spacing:2.5px; color:rgba(241,234,215,.6); text-transform:uppercase; }
.community{ display:flex; gap:6px; justify-content:center; --w:clamp(42px, 11.6vw, 76px); }
.pot{
  display:inline-flex; align-items:center; gap:8px; background:rgba(0,0,0,.35); border:1px solid rgba(224,184,74,.3);
  border-radius:999px; padding:5px 14px 5px 6px; font-weight:700; font-size:15px;
}
.pot .lbl{ font-size:10px; letter-spacing:1.5px; color:var(--text-dim); font-weight:700; }
.winner-banner{
  font-size:13.5px; font-weight:600; color:#2a1f03; background:linear-gradient(180deg,#f3d67a,var(--gold-2));
  padding:7px 14px; border-radius:999px; max-width:100%; box-shadow:0 6px 18px rgba(0,0,0,.35);
  animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{ from{ transform:scale(.6); opacity:0; } to{ transform:none; opacity:1; } }
.invite{
  background:rgba(0,0,0,.32); border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:14px 16px; width:100%; max-width:300px;
}
.invite .k{ font-size:10.5px; letter-spacing:1.6px; color:var(--text-dim); font-weight:700; text-transform:uppercase; }
.invite .code{ font-family:'Fraunces', Georgia, serif; font-weight:800; font-size:34px; letter-spacing:7px; color:var(--gold); margin:2px 0 8px; padding-left:7px; }
.invite .btn{ padding:10px 12px; font-size:13.5px; }
.invite p{ margin:10px 0 0; font-size:12.5px; color:var(--text-dim); line-height:1.4; }

/* chips */
.chip-ico{ width:18px; height:18px; flex-shrink:0; border-radius:50%;
  background: radial-gradient(circle, var(--gold) 0 38%, transparent 39%), repeating-conic-gradient(var(--gold) 0 30deg, #fff6d8 30deg 60deg);
  box-shadow:0 0 0 1.5px rgba(0,0,0,.35), inset 0 0 0 2px rgba(0,0,0,.15);
}
.chip-ico.red{ background: radial-gradient(circle, #c94a3b 0 38%, transparent 39%), repeating-conic-gradient(#c94a3b 0 30deg, #fbe9e4 30deg 60deg); }

/* cards */
.card{
  width:var(--w); height:calc(var(--w) * 1.4); border-radius:calc(var(--w) * .13);
  background:linear-gradient(170deg,#fffef8,#efe7d2); color:var(--ink);
  position:relative; flex-shrink:0; font-weight:700; line-height:1;
  box-shadow:0 2px 0 rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.4);
}
.card .ix{ position:absolute; top:3%; left:7%; display:flex; flex-direction:column; align-items:center; font-size:calc(var(--w) * .56); font-weight:800; line-height:.92; letter-spacing:-1px; }
.card.ten .ix{ font-size:calc(var(--w) * .46); letter-spacing:-2px; }
.card .ix i{ font-style:normal; font-size:.66em; margin-top:2px; }
.card .pip{ position:absolute; right:5%; bottom:1%; font-size:calc(var(--w) * .72); line-height:1; }
.four .card.s-D{ color:#1d63c9; }
.four .card.s-C{ color:#1f8a43; }
.card.real{ border-color:rgba(224,184,74,.7); }
.card.red{ color:var(--red); }
.card.back{
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.12) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, #7a1f22 0 4px, #8d2a2c 4px 8px);
  border:2px solid #f3ecd8;
}
.card.slot{ background:rgba(0,0,0,.12); border:1.5px dashed rgba(255,255,255,.16); box-shadow:none; }
.card.deal{ animation:deal .38s cubic-bezier(.2,.8,.25,1) both; }
.card.hl{ box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(224,184,74,.6); }
.card.dim{ filter:brightness(.6) saturate(.6); }
@keyframes deal{ from{ opacity:0; transform:translateY(-18px) rotate(-8deg) scale(.85); } to{ opacity:1; transform:none; } }

/* seats */
#seats{ position:absolute; inset:0; z-index:4; pointer-events:none; }
.seat{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; width:118px; pointer-events:auto; transition:opacity .2s ease; }
.seat-cards{ display:flex; gap:2px; margin-bottom:-10px; z-index:0; --w:32px; }
.seat-cards .card:first-child{ transform:rotate(-6deg); }
.seat-cards .card:last-child{ transform:rotate(6deg); }
.seat.showcards .seat-cards{ --w:46px; margin-bottom:-8px; }
.won{ position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--ok); color:#04210f; font-weight:800; font-size:12.5px; border-radius:999px; padding:1px 9px; white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.4); animation:pop .35s cubic-bezier(.2,1.4,.4,1) both; z-index:3; }
.pod{
  position:relative; z-index:1; display:flex; align-items:center; gap:7px;
  background:rgba(7,14,11,.86); border:1.5px solid rgba(241,234,215,.14);
  border-radius:999px; padding:4px 12px 4px 4px; min-width:104px; max-width:118px;
  box-shadow:0 6px 16px rgba(0,0,0,.45);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.avatar{
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff;
  background:hsl(var(--hue,140) 45% 38%); box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);
}
.meta{ min-width:0; text-align:left; }
.meta .nm{ font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70px; }
.meta .ch{ font-size:11.5px; color:var(--gold); font-weight:600; }
.dealer-btn{
  position:absolute; top:-7px; right:-5px; width:20px; height:20px; border-radius:50%;
  background:#fff; color:#111; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.5), inset 0 0 0 2px #ddd;
}

<script>
/* ENGINE START
   Poker rules engine: pure functions over a plain-object table state.
   tests/engine.js loads this block straight out of index.html, so the
   tests always run against the code that ships. */
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const SUITS = ['S','H','D','C'];
function rankVal(r){ return RANKS.indexOf(r) + 2; }
function freshDeck(){
  const d = [];
  for (const s of SUITS) for (const r of RANKS) d.push(r+s);
  return d;
}
function randInt(n){
  if (typeof crypto !== 'undefined' && crypto.getRandomValues){
    const buf = new Uint32Array(1), lim = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= lim);
    return buf[0] % n;
  }
  return Math.floor(Math.random()*n);
}
function shuffle(deck){
  const d = deck.slice();
  for (let i = d.length-1; i>0; i--){
    const j = randInt(i+1);
    [d[i],d[j]] = [d[j],d[i]];
  }
  return d;
}
function combinations(arr, k){
  const res = [];
  function rec(start, combo){
    if (combo.length === k){ res.push(combo.slice()); return; }
    for (let i=start;i<arr.length;i++){
      combo.push(arr[i]);
      rec(i+1, combo);
      combo.pop();
    }
  }
  rec(0, []);
  return res;
}
function score5(cards){
  const ranks = cards.map(c=>rankVal(c[0])).sort((a,b)=>b-a);
  const suits = cards.map(c=>c[1]);
  const isFlush = suits.every(s=>s===suits[0]);
  const uniq = [...new Set(ranks)];
  let isStraight = false, straightHigh = 0;
  if (uniq.length === 5){
    if (uniq[0]-uniq[4] === 4){ isStraight = true; straightHigh = uniq[0]; }
    else if (uniq[0]===14 && uniq[1]===5 && uniq[4]===2){ isStraight = true; straightHigh = 5; }
  }
  const counts = {};
  for (const r of ranks) counts[r] = (counts[r]||0)+1;
  const groups = Object.entries(counts).map(([r,c])=>[Number(r),c])
    .sort((a,b)=> b[1]-a[1] || b[0]-a[0]);

  if (isStraight && isFlush) return [8, straightHigh];
  if (groups[0][1]===4) return [7, groups[0][0], groups[1][0]];
  if (groups[0][1]===3 && groups[1][1]===2) return [6, groups[0][0], groups[1][0]];
  if (isFlush) return [5, ...ranks];
  if (isStraight) return [4, straightHigh];
  if (groups[0][1]===3) return [3, groups[0][0], ...groups.slice(1).map(g=>g[0])];
  if (groups[0][1]===2 && groups[1][1]===2) return [2, groups[0][0], groups[1][0], groups[2][0]];
  if (groups[0][1]===2) return [1, groups[0][0], ...groups.slice(1).map(g=>g[0])];
  return [0, ...ranks];
}
function compareScores(a,b){
  const len = Math.max(a.length,b.length);
  for (let i=0;i<len;i++){
    const x = a[i]||0, y = b[i]||0;
    if (x!==y) return x-y;
  }
  return 0;
}
// Best 5-card hand out of 5, 6 or 7 cards.
function evaluate7(cards){
  let best = null;
  for (const c of combinations(cards, 5)){
    const sc = score5(c);
    if (!best || compareScores(sc, best) > 0) best = sc;
  }
  return best;
}
const HAND_NAMES = ['High Card','Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];
function rankName(v, plural){
  const n = {2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight',9:'Nine',10:'Ten',11:'Jack',12:'Queen',13:'King',14:'Ace'}[v];
  return plural ? (v===6 ? 'Sixes' : n+'s') : n;
}
function handLabel(sc){
  switch(sc[0]){
    case 8: return sc[1]===14 ? 'Royal Flush' : `Straight Flush, ${rankName(sc[1])} high`;
    case 7: return `Four ${rankName(sc[1],true)}`;
    case 6: return `Full House, ${rankName(sc[1],true)} full of ${rankName(sc[2],true)}`;
    case 5: return `Flush, ${rankName(sc[1])} high`;
    case 4: return `Straight, ${rankName(sc[1])} high`;
    case 3: return `Three ${rankName(sc[1],true)}`;
    case 2: return `Two Pair, ${rankName(sc[1],true)} & ${rankName(sc[2],true)}`;
    case 1: return `Pair of ${rankName(sc[1],true)}`;
    default: return `${rankName(sc[1])} High`;
  }
}

const START_CHIPS = 1000;
const SMALL_BLIND = 5;
const BIG_BLIND = 10;
const MAX_PLAYERS = 9;
const BETTING_STAGES = ['preflop','flop','turn','river'];

function newTable(code, opts){
  opts = opts || {};
  const bb = opts.bigBlind || BIG_BLIND;
  return {
    code, stage:'waiting',
    players: [], deck: [], community: [],
    dealerSeat: -1, turnSeat: -1,
    currentBet: 0, minRaise: bb,
    smallBlind: opts.smallBlind || SMALL_BLIND, bigBlind: bb,
    startChips: opts.startChips || START_CHIPS, turnSecs: opts.turnSecs || 0,
    mode: opts.mode==='chips' ? 'chips' : 'cards',   // 'chips' = real cards on the table, app tracks chips only
    pots: null,
    handNum: 0, log: [], winnerMsg: '', winners: [], ver: 0
  };
}
function pushLog(state, line){
  state.log = [...state.log, line].slice(-80);
}
function addPlayer(state, id, name){
  if (state.players.find(p=>p.id===id)) return state;
  state.players.push({
    id, name, chips: state.startChips || START_CHIPS, bet:0, totalBet:0,
    inHand:false, folded:false, allIn:false, hasActed:false,
    cards:[], away:false, buyIns:1
  });
  pushLog(state, name+' sat down');
  return state;
}
function isBetting(state){ return BETTING_STAGES.includes(state.stage); }
function eligibleSeats(state){
  return state.players.map((p,i)=>i).filter(i=>{
    const p = state.players[i];
    return !p.away && !p.sitOut && p.chips>0;
  });
}
function seatOrderFrom(state, startSeat, seats){
  const idx = seats.indexOf(startSeat);
  if (idx===-1){
    const n = state.players.length;
    for (let off=0; off<n; off++){
      const j = seats.indexOf((startSeat+off)%n);
      if (j!==-1) return seats.slice(j).concat(seats.slice(0,j));
    }
    return seats.slice();
  }
  return seats.slice(idx).concat(seats.slice(0,idx));
}
function startHand(state){
  if (isBetting(state)) return {ok:false, error:'A hand is already in progress'};
  if (state.stage==='award') return {ok:false, error:'Pick the winner of the last hand first'};
  const eligible = eligibleSeats(state);
  if (eligible.length < 2) return {ok:false, error:'Need at least 2 players with chips'};
  state.handNum += 1;
  state.stage = 'preflop';
  state.community = [];
  state.winnerMsg = '';
  state.winners = [];
  state.pots = null;
  state.deck = state.mode==='chips' ? [] : shuffle(freshDeck());
  state.players.forEach((p,i)=>{
    p.cards = []; p.bet = 0; p.totalBet = 0; p.hasActed = false; p.allIn = false;
    p.inHand = eligible.includes(i);
    p.folded = !p.inHand;
    p.won = 0; p.put = 0;
    delete p.revealedHand; delete p.shown;
  });
  const n = state.players.length;
  let d = eligible[0];
  for (let off=1; off<=n; off++){
    const cand = ((state.dealerSeat+off)%n + n)%n;
    if (eligible.includes(cand)){ d = cand; break; }
  }
  state.dealerSeat = d;
  const seatOrder = seatOrderFrom(state, d, eligible);
  const len = seatOrder.length;
  if (state.mode!=='chips'){
    for (let r=0;r<2;r++){
      for (const seat of seatOrder) state.players[seat].cards.push(state.deck.pop());
    }
  }
  // Heads-up: the dealer posts the small blind and acts first pre-flop.
  const sbSeat = len===2 ? seatOrder[0] : seatOrder[1];
  const bbSeat = len===2 ? seatOrder[1] : seatOrder[2];
  postBet(state, sbSeat, state.smallBlind);
  postBet(state, bbSeat, state.bigBlind);
  state.currentBet = state.bigBlind;
  state.minRaise = state.bigBlind;
  pushLog(state, `Hand #${state.handNum} — ${state.players[sbSeat].name} posts SB ${state.smallBlind}, ${state.players[bbSeat].name} posts BB ${state.bigBlind}`);
  state.turnSeat = seatOrder[(seatOrder.indexOf(bbSeat)+1)%len];
  // Blinds can put everyone all-in; skip straight ahead if nobody can act.
  if (bettingRoundComplete(state)) return {ok:true, state: moveToNextStreetOrShowdown(state)};
  if (state.players[state.turnSeat].allIn) state.turnSeat = nextTurnSeat(state, state.turnSeat);
  return {ok:true, state};
}
function postBet(state, seat, amount){
  const p = state.players[seat];
  const actual = Math.min(amount, p.chips);
  p.chips -= actual; p.bet += actual; p.totalBet += actual;
  if (p.chips===0) p.allIn = true;
}
function activeForTurn(state){
  return state.players.map((p,i)=>i).filter(i=>{
    const p = state.players[i];
    return p.inHand && !p.folded && !p.allIn;
  });
}
function inHandNotFolded(state){
  return state.players.map((p,i)=>i).filter(i=> state.players[i].inHand && !state.players[i].folded);
}
function nextTurnSeat(state, fromSeat){
  const turnEligible = activeForTurn(state);
  if (turnEligible.length===0) return -1;
  const n = state.players.length;
  for (let off=1; off<=n; off++){
    const cand = (fromSeat+off)%n;
    if (turnEligible.includes(cand)) return cand;
  }
  return -1;
}
function bettingRoundComplete(state){
  if (inHandNotFolded(state).length<=1) return true;
  const turnEligible = activeForTurn(state);
  if (turnEligible.length===0) return true;
  // One player left who can act and nobody to bet against: nothing more to decide.
  if (turnEligible.length===1 && state.players[turnEligible[0]].bet >= state.currentBet) return true;
  return turnEligible.every(i=>{
    const p = state.players[i];
    return p.hasActed && p.bet === state.currentBet;
  });
}
function reopenAction(state, seat){
  state.players.forEach((pl,i)=>{ if (i!==seat && pl.inHand && !pl.folded && !pl.allIn) pl.hasActed=false; });
}
function applyAction(state, playerId, type, amount){
  if (!isBetting(state)) return {ok:false, error:'No hand in progress'};
  const seat = state.players.findIndex(p=>p.id===playerId);
  if (seat===-1) return {ok:false, error:'You are not seated at this table'};
  if (state.turnSeat !== seat) return {ok:false, error:"It's not your turn"};
  const p = state.players[seat];
  const toCall = state.currentBet - p.bet;

  if (type==='bet' || type==='raise'){
    const target = Math.floor(Number(amount));
    if (!isFinite(target)) return {ok:false, error:'Invalid amount'};
    if (target <= state.currentBet) return {ok:false, error:'A raise must be more than the current bet'};
    const need = target - p.bet;
    if (need > p.chips) return {ok:false, error:'Not enough chips'};
    if (need === p.chips) type = 'allin';
    else if (target - state.currentBet < state.minRaise) return {ok:false, error:`Minimum raise is to ${state.currentBet + state.minRaise}`};
  }

  if (type==='fold'){
    p.folded = true; p.hasActed = true;
    pushLog(state, `${p.name} folds`);
  } else if (type==='check'){
    if (toCall>0) return {ok:false, error:"You can't check — there's a bet to call"};
    p.hasActed = true;
    pushLog(state, `${p.name} checks`);
  } else if (type==='call'){
    if (toCall<=0) return {ok:false, error:'Nothing to call'};
    const pay = Math.min(toCall, p.chips);
    p.chips -= pay; p.bet += pay; p.totalBet += pay;
    if (p.chips===0) p.allIn = true;
    p.hasActed = true;
    pushLog(state, `${p.name} calls ${pay}${p.allIn?' (all-in)':''}`);
  } else if (type==='bet' || type==='raise'){
    const target = Math.floor(Number(amount));
    const need = target - p.bet;
    const wasBet = state.currentBet===0;
    p.chips -= need; p.bet += need; p.totalBet += need;
    state.minRaise = target - state.currentBet;
    state.currentBet = target;
    reopenAction(state, seat);
    p.hasActed = true;
    pushLog(state, `${p.name} ${wasBet ? 'bets':'raises to'} ${target}`);
  } else if (type==='allin'){
    if (p.chips<=0) return {ok:false, error:'No chips left'};
    p.bet += p.chips; p.totalBet += p.chips; p.chips = 0; p.allIn = true; p.hasActed = true;
    if (p.bet > state.currentBet){
      const raiseSize = p.bet - state.currentBet;
      state.currentBet = p.bet;
      // A short all-in doesn't reopen betting for players who already acted.
      if (raiseSize >= state.minRaise){ reopenAction(state, seat); state.minRaise = raiseSize; }
    }
    pushLog(state, `${p.name} goes all-in for ${p.bet}`);
  } else {
    return {ok:false, error:'Unknown action'};
  }
  return {ok:true, state};
}
function collectPotTotal(state){ return state.players.reduce((s,p)=>s+p.totalBet,0); }
function advanceAfterAction(state){
  if (inHandNotFolded(state).length<=1) return finishHandBySingleWinner(state);
  if (bettingRoundComplete(state)) return moveToNextStreetOrShowdown(state);
  state.turnSeat = nextTurnSeat(state, state.turnSeat);
  return state;
}
function resetStreetBets(state){
  state.players.forEach(p=>{ p.bet=0; p.hasActed=false; });
  state.currentBet = 0;
  state.minRaise = state.bigBlind;
}
function moveToNextStreetOrShowdown(state){
  const real = state.mode==='chips';
  if (state.stage==='preflop'){
    if (!real){ state.deck.pop(); state.community.push(state.deck.pop(), state.deck.pop(), state.deck.pop()); } // burn + flop
    state.stage='flop';
  } else if (state.stage==='flop'){
    if (!real){ state.deck.pop(); state.community.push(state.deck.pop()); }
    state.stage='turn';
  } else if (state.stage==='turn'){
    if (!real){ state.deck.pop(); state.community.push(state.deck.pop()); }
    state.stage='river';
  } else {
    return real ? doChipsShowdown(state) : doShowdown(state);
  }
  resetStreetBets(state);
  pushLog(state, real ? `— ${state.stage.toUpperCase()} — deal the ${state.stage==='flop' ? 'flop (3 cards)' : state.stage+' card'}`
                      : `— ${state.stage.toUpperCase()} — ${state.community.join(' ')}`);
  if (activeForTurn(state).length<=1) return moveToNextStreetOrShowdown(state);
  state.turnSeat = nextTurnSeat(state, state.dealerSeat);
  return state;
}
function finishHandBySingleWinner(state){
  const contenders = inHandNotFolded(state);
  const pot = collectPotTotal(state);
  if (contenders.length===1){
    const w = state.players[contenders[0]];
    state.players.forEach(p=>{ p.put = p.totalBet; });
    w.chips += pot; w.won = pot;
    pushLog(state, `${w.name} wins ${pot} — everyone else folded`);
    state.winnerMsg = `${w.name} wins ${pot}`;
    state.winners = [w.id];
  }
  state.players.forEach(p=>{ p.bet=0; p.totalBet=0; });
  state.stage = 'showdown'; state.turnSeat = -1;
  return state;
}
function distributeSidePots(state, contenders){
  const levels = [...new Set(state.players.filter(p=>p.totalBet>0).map(p=>p.totalBet))].sort((a,b)=>a-b);
  let prevLevel = 0;
  const payouts = {};
  for (const level of levels){
    const slice = level - prevLevel;
    const payers = state.players.filter(p=>p.totalBet > prevLevel);
    const potSlice = slice * payers.length;
    const eligible = contenders.filter(seat => state.players[seat].totalBet >= level);
    if (potSlice>0 && eligible.length>0){
      let best=null, winners=[];
      for (const seat of eligible){
        const sc = evaluate7([...state.players[seat].cards, ...state.community]);
        if (!best || compareScores(sc,best)>0){ best=sc; winners=[seat]; }
        else if (compareScores(sc,best)===0){ winners.push(seat); }
      }
      const share = Math.floor(potSlice/winners.length);
      const remainder = potSlice - share*winners.length;
      winners.forEach((seat,i)=>{ payouts[seat] = (payouts[seat]||0) + share + (i<remainder?1:0); });
    }
    prevLevel = level;
  }
  return payouts;
}
function doShowdown(state){
  const contenders = inHandNotFolded(state);
  const pot = collectPotTotal(state);
  const payouts = distributeSidePots(state, contenders);
  const lines = [];
  for (const seat of contenders){
    const p = state.players[seat];
    p.revealedHand = handLabel(evaluate7([...p.cards, ...state.community]));
    lines.push(`${p.name} shows ${p.cards.join(' ')} (${p.revealedHand})`);
  }
  state.players.forEach(p=>{ p.put = p.totalBet; });
  Object.entries(payouts).forEach(([seat,amt])=>{ const p = state.players[Number(seat)]; p.chips += amt; p.won = amt; });
  lines.forEach(l=>pushLog(state, l));
  const net = Object.entries(payouts).map(([seat,amt])=>({p:state.players[Number(seat)], amt}))
    .filter(x=> x.amt > x.p.totalBet || contenders.length===1); // skip players who only got their own uncalled chips back
  const shown = net.length ? net : Object.entries(payouts).map(([seat,amt])=>({p:state.players[Number(seat)], amt}));
  state.winners = shown.map(x=>x.p.id);
  state.winnerMsg = shown.map(x=>`${x.p.name} wins ${x.amt}${x.p.revealedHand ? ' with '+x.p.revealedHand : ''}`).join(' · ');
  pushLog(state, `Pot ${pot}: ${state.winnerMsg}`);
  state.stage = 'showdown';
  state.turnSeat = -1;
  state.players.forEach(p=>{ p.bet=0; p.totalBet=0; });
  return state;
}
// Real-cards mode: the app can't see the cards, so at showdown it splits the
// chips into the main pot and any side pots (each with the players who can
// win it), and the table picks the winner of each.
function buildPots(state, contenders){
  const levels = [...new Set(state.players.filter(p=>p.totalBet>0).map(p=>p.totalBet))].sort((a,b)=>a-b);
  let prev = 0;
  const pots = [];
  for (const level of levels){
    const amount = (level - prev) * state.players.filter(p=>p.totalBet > prev).length;
    let eligible = contenders.filter(seat=>state.players[seat].totalBet >= level).map(seat=>state.players[seat].id);
    prev = level;
    if (amount<=0) continue;
    if (!eligible.length){
      if (pots.length){ pots[pots.length-1].amount += amount; continue; }
      eligible = contenders.map(seat=>state.players[seat].id);
    }
    const last = pots[pots.length-1];
    if (last && last.eligible.join()===eligible.join()) last.amount += amount;
    else pots.push({amount, eligible, winners:null});
  }
  return pots;
}
function payPot(state, pot, winnerIds){
  const share = Math.floor(pot.amount / winnerIds.length);
  const remainder = pot.amount - share*winnerIds.length;
  winnerIds.forEach((id,i)=>{
    const p = state.players.find(pl=>pl.id===id);
    const amt = share + (i<remainder ? 1 : 0);
    p.chips += amt; p.won = (p.won||0) + amt;
  });
  pot.winners = winnerIds.slice();
}
function potName(state, i){ return i===0 ? 'the main pot' : (state.pots.length>2 ? `side pot ${i}` : 'the side pot'); }
function doChipsShowdown(state){
  const contenders = inHandNotFolded(state);
  state.pots = buildPots(state, contenders);
  state.players.forEach(p=>{ p.put = p.totalBet; p.won = 0; p.bet = 0; p.totalBet = 0; });
  // A pot only one player can win (e.g. an uncalled bet) just goes back to them.
  state.pots.forEach(pt=>{ if (pt.eligible.length===1) payPot(state, pt, pt.eligible); });
  state.turnSeat = -1;
  if (state.pots.every(pt=>pt.winners)) return finishAward(state);
  state.stage = 'award';
  pushLog(state, '— SHOWDOWN — turn your cards over and pick the winner');
  return state;
}
function awardPot(state, potIndex, winnerIds, byName){
  if (state.stage!=='award' || !state.pots) return {ok:false, error:'There is no pot to award right now'};
  const pot = state.pots[potIndex];
  if (!pot || pot.winners) return {ok:false, error:'That pot has already been awarded'};
  const ws = [...new Set(winnerIds||[])].filter(id=>pot.eligible.includes(id));
  if (!ws.length) return {ok:false, error:'Pick at least one winner'};
  payPot(state, pot, ws);
  const names = ws.map(id=>state.players.find(p=>p.id===id).name).join(' & ');
  pushLog(state, `${byName ? byName+' awarded ' : ''}${potName(state, potIndex)} (${pot.amount}) to ${names}${ws.length>1 ? ' (split)' : ''}`);
  if (state.pots.every(pt=>pt.winners)) finishAward(state);
  return {ok:true, state};
}
function finishAward(state){
  const gainers = state.players.filter(p=>p.won > p.put);
  const shown = gainers.length ? gainers : state.players.filter(p=>p.won>0);
  state.winners = shown.map(p=>p.id);
  state.winnerMsg = shown.map(p=>`${p.name} wins ${p.won}`).join(' · ');
  pushLog(state, `Result: ${state.winnerMsg}`);
  state.stage = 'showdown';
  state.turnSeat = -1;
  return state;
}
// After a hand, any player can show one or both of their cards.
function showCards(state, playerId, which){
  if (state.stage!=='showdown') return {ok:false, error:'You can show your cards once the hand is over'};
  const p = state.players.find(pl=>pl.id===playerId);
  if (!p || !p.cards || p.cards.length!==2) return {ok:false, error:'You have no cards to show'};
  p.shown = p.shown || [false,false];
  if (which==='both'){ p.shown = [true,true]; }
  else if (which===0 || which===1){ p.shown[which] = true; }
  else return {ok:false, error:'Unknown card'};
  pushLog(state, `${p.name} shows ${p.cards.filter((c,i)=>p.shown[i]).join(' ')}`);
  return {ok:true, state};
}
function readyForNextHand(state){
  state.stage='waiting';
  state.community=[];
  state.players.forEach(p=>{ p.cards=[]; p.folded=false; p.inHand=false; p.allIn=false; p.hasActed=false; delete p.revealedHand; });
  return state;
}
function rebuy(state, playerId){
  if (isBetting(state)) return {ok:false, error:'Wait for the hand to finish'};
  const p = state.players.find(pl=>pl.id===playerId);
  if (!p) return {ok:false, error:'You are not seated at this table'};
  if (p.chips>0) return {ok:false, error:'You can only rebuy when you are out of chips'};
  p.chips = state.startChips || START_CHIPS; p.buyIns = (p.buyIns||1)+1;
  pushLog(state, `${p.name} rebuys for ${p.chips}`);
  return {ok:true, state};
}
/* ENGINE END */

/* =========================================================
   NETWORKING — messages travel through free public MQTT relays over
   secure WebSockets, so it works on any network where normal websites
   work (no peer-to-peer, no accounts, no server of our own).
   The host's browser is still the referee: it keeps the real game state
   and everyone else sends it requests. We connect to two relays at once
   and send everything through both, so one being down doesn't matter.
   Messages are encrypted with a key derived from the room code, and
   topic names are hashed, so strangers on the relay can't read the game.
   ========================================================= */
const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const HEARTBEAT_MS = 4000;
const LOST_AFTER_MS = 16000;   // no message for this long = disconnected
const JOIN_TIMEOUT_MS = 15000;
const RELAY_TIMEOUT_MS = 12000;

const store = {
  get(k, session){ try{ return (session?sessionStorage:localStorage).getItem(k); }catch(e){ return null; } },
  set(k, v, session){ try{ (session?sessionStorage:localStorage).setItem(k, v); }catch(e){} },
  del(k, session){ try{ (session?sessionStorage:localStorage).removeItem(k); }catch(e){} },
  json(k, session){ try{ return JSON.parse(this.get(k, session)); }catch(e){ return null; } }
};
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'');
  return 'p'+Math.random().toString(36).slice(2)+Date.now().toString(36);
}
// Player id is per browser tab (sessionStorage), so two tabs in one browser
// are two different players, and a reload keeps your seat.
let myId = store.get('ff_pid', true) || uid();
store.set('ff_pid', myId, true);

let myName = '';

let turnDeadline = 0;      // local clock ms when the current turn times out (0 = no timer)

// host

// client

let hostLastSeen = 0, lastPing = 0, knownHostSession = null;

const el = (id)=>document.getElementById(id);

/* ---------- encrypted relay transport ---------- */
const te = new TextEncoder(), td = new TextDecoder();
async function sha256hex(str){
  const h = await crypto.subtle.digest('SHA-256', te.encode(str));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function roomKey(code){
  const base = await crypto.subtle.importKey('raw', te.encode('room:'+code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:te.encode('felt-and-fortune-v3'), iterations:100000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12+ct.length); out.set(iv); out.set(ct, 12);
  return out;
}
async function unseal(key, bytes){
  const u = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, key, u.slice(12));
  return JSON.parse(td.decode(pt));
}
const seenMids = new Set();
function markSeen(mid){
  seenMids.add(mid);
  if (seenMids.size > 3000){ const it = seenMids.values(); for (let i=0;i<1000;i++) seenMids.delete(it.next().value); }
}
async function netOpen(code, subTopics, onMessage){
  netClose();
  const n = {closed:false, clients:[]};
  net = n;
  n.key = await roomKey(code);
  n.base = 'feltfortune/v3/' + (await sha256hex('room:'+code)).slice(0,32);
  if (n.closed) return n;
  const subs = subTopics(n.base);
  RELAYS.forEach(url=>{
    const c = mqtt.connect(url, {
      clientId: 'ff_'+uid().slice(0,20), clean:true, keepalive:30,
      reconnectPeriod:2500, connectTimeout:10000, resubscribe:true
    });
    c.on('connect', ()=>{ c.subscribe(subs, {qos:1}); updateNetStatus(); });
    c.on('message', async (topic, payload)=>{
      if (n.closed) return;
      let msg;
      try{ msg = await unseal(n.key, payload); }catch(e){ return; }   // not ours / wrong room
      if (!msg || typeof msg!=='object' || !msg.mid || seenMids.has(msg.mid)) return;
      markSeen(msg.mid);
      try{ onMessage(topic.slice(n.base.length), msg); }catch(e){ console.error(e); }
    });
    ['close','offline','error','reconnect'].forEach(ev=>c.on(ev, updateNetStatus));
    n.clients.push(c);
  });
  return n;
}
function relaysUp(){ return net ? net.clients.filter(c=>c.connected).length : 0; }
function waitForRelay(ms){
  return new Promise(res=>{
    const t0 = Date.now();
    const iv = setInterval(()=>{
      if (relaysUp()>0){ clearInterval(iv); res(true); }
      else if (Date.now()-t0 > ms || !net){ clearInterval(iv); res(false); }
    }, 150);
  });
}
async function netSend(sub, obj){
  const n = net;
  if (!n || n.closed || !n.key) return false;
  obj.mid = uid();
  markSeen(obj.mid); // ignore our own echo
  const bytes = await seal(n.key, obj);
  let sent = false;
  n.clients.forEach(c=>{ if (c.connected){ c.publish(n.base+sub, bytes, {qos:1}); sent = true; } });
  return sent;
}
function netClose(){
  if (!net) return;
  net.closed = true;
  net.clients.forEach(c=>{ try{ c.end(true); }catch(e){} });
  net = null;
}

/* ---------- host-side logic ---------- */
// What one player is allowed to see: no deck, nobody else's hole cards
// until they're shown down, and nobody else's private player id (so it
// can't be used to send moves in their name).
function viewFor(pid, s){
  const v = clone(s);
  delete v.deck;
  const alias = {};
  v.players.forEach((p,i)=>{
    if (p.id!==pid){
      alias[p.id] = 'seat'+i; p.id = 'seat'+i;
      if (!p.revealedHand) p.cards = p.cards.map((c,k)=> p.shown && p.shown[k] ? c : 'XX');
    }
  });
  v.winners = (v.winners||[]).map(id=> alias[id] || id);
  if (v.pots) v.pots.forEach(pt=>{ pt.eligible = pt.eligible.map(id=> alias[id] || id); if (pt.winners) pt.winners = pt.winners.map(id=> alias[id] || id); });
  return v;
}
// Players who are away or sitting out check when they can and fold when
// they can't, so the table never waits on them.
function autoActAway(s){
  let guard = 0;
  while (isBetting(s) && s.turnSeat>=0 && s.players[s.turnSeat] && (s.players[s.turnSeat].away || s.players[s.turnSeat].sitOut) && guard++ < 50){
    const p = s.players[s.turnSeat];
    const r = applyAction(s, p.id, (s.currentBet - p.bet) > 0 ? 'fold' : 'check');
    if (!r.ok) break;
    s = advanceAfterAction(r.state);
  }
  return s;
}
function turnLeftMs(){ return turnDeadline ? Math.max(0, turnDeadline - Date.now()) : null; }
function sendStateTo(pid){
  const r = roster[pid];
  if (!r || !latestState) return;
  netSend('/p/'+r.inbox, {t:'state', session:hostSession, state:viewFor(pid, latestState), turnLeft:turnLeftMs()});
}
function commit(s){
  s = autoActAway(s);
  s.ver = (s.ver||0) + 1;
  latestState = s;
  // Restart the turn clock whenever the turn moves to someone new.
  const key = isBetting(s) ? `${s.handNum}:${s.stage}:${s.turnSeat}:${s.log.length}` : '';
  if (key!==hostTurnKey){
    hostTurnKey = key;
    turnDeadline = key && s.turnSecs ? Date.now() + s.turnSecs*1000 : 0;
  }
  saveHostSnapshot();
  Object.keys(roster).forEach(sendStateTo);
  render();
}
function replyError(pid, message){
  if (pid===myId) toast(message, 'error');
  else if (roster[pid]) netSend('/p/'+roster[pid].inbox, {t:'error', message});
}
function pruneLeft(s){
  if (isBetting(s)) return;
  const d = s.dealerSeat;
  s.dealerSeat -= s.players.filter((p,i)=>p.left && i<=d).length;
  s.players = s.players.filter(p=>!p.left);
}
function hostDispatch(pid, data){
  if (!latestState) return;
  let s = clone(latestState), r;
  const p = s.players.find(pl=>pl.id===pid);
  if (data.t==='start'){
    pruneLeft(s); // drop players who left mid-hand before dealing the next one
    r = startHand(s);
  } else if (data.t==='action'){
    r = applyAction(s, pid, data.action, data.amount);
    if (r.ok){ if (p) p.timeouts = 0; r.state = advanceAfterAction(r.state); }
  } else if (data.t==='rebuy'){
    r = rebuy(s, pid);
  } else if (data.t==='award'){
    if (!p || p.away) return;
    // Players see each other as 'seatN'; turn those back into real ids.
    const real = id=>{ const m = /^seat(\d+)$/.exec(String(id)); return m && s.players[+m[1]] ? s.players[+m[1]].id : String(id); };
    r = awardPot(s, Number(data.pot), (Array.isArray(data.winners) ? data.winners : []).map(real), p.name);
  } else if (data.t==='show'){
    r = showCards(s, pid, data.which==='both' ? 'both' : Number(data.which));
  } else if (data.t==='sitout' || data.t==='back'){
    if (!p) return;
    p.sitOut = data.t==='sitout'; p.timeouts = 0;
    pushLog(s, p.name + (p.sitOut ? ' is sitting out' : ' is back in'));
    r = {ok:true, state:s};
  } else if (data.t==='leave' || data.t==='kick'){
    const target = data.t==='kick' ? s.players.find(pl=>pl.id===data.target) : p;
    if (!target || target.id===myId && data.t==='kick') return;
    target.away = true; target.left = true;
    pushLog(s, target.name + (data.t==='kick' ? ' was removed by the host' : ' left the table'));
    if (data.t==='kick' && roster[target.id]) netSend('/p/'+roster[target.id].inbox, {t:'kicked'});
    delete roster[target.id];
    pruneLeft(s);
    r = {ok:true, state:s};
  } else return;
  if (!r.ok){ replyError(pid, r.error); return; }
  commit(r.state);
}
function hostOnMessage(sub, msg){
  if (sub==='/all'){
    // Someone opened this same table more recently (e.g. on another device).
    if (msg.t==='host' && msg.session!==hostSession && msg.at > hostStartedAt){
      toast('This table was reopened on another device or tab', 'error');
      isHost = false; netClose(); backToLobby();
    }
    return;
  }
  if (sub!=='/h' || !latestState) return;
  const pid = typeof msg.from==='string' ? msg.from.slice(0,64) : null;
  if (!pid || pid===myId) return;
  const inbox = typeof msg.inbox==='string' ? msg.inbox.replace(/[^a-z0-9]/gi,'').slice(0,64) : null;
  const now = Date.now();
  const seated = latestState.players.find(p=>p.id===pid);

  if (msg.t==='join' || (msg.t==='ping' && seated && inbox)){
    if (!inbox) return;
    roster[pid] = {inbox, lastSeen: now};
    let s = clone(latestState);
    const existing = s.players.find(p=>p.id===pid);
    if (existing){
      if (!existing.away && msg.t==='ping'){
        // Normal heartbeat: only resend state if they missed an update.
        if (msg.ver!==latestState.ver) sendStateTo(pid);
        return;
      }
      if (existing.away) pushLog(s, existing.name+' is back');
      existing.away = false;
      if (msg.t==='join') existing.name = cleanName(msg.name);
    } else {
      if (s.players.length >= MAX_PLAYERS){
        netSend('/p/'+inbox, {t:'rejected', message:`Table ${currentCode} is full (${MAX_PLAYERS} players).`});
        delete roster[pid];
        return;
      }
      s = addPlayer(s, pid, cleanName(msg.name));
      toast(cleanName(msg.name)+' joined the table', 'ok');
    }
    commit(s);
    return;
  }
  if (!roster[pid]) return;  // not joined (yet)
  roster[pid].lastSeen = now;
  if (msg.t==='sync') sendStateTo(pid);
  else if (msg.t==='kick') return;   // only the host can remove players
  else hostDispatch(pid, msg);
}
function hostTickLoop(){
  if (!isHost || !latestState) return;
  const now = Date.now();
  // If this tab was asleep (phone screen off, tab in background) or offline,
  // we missed everyone's heartbeats; give them a fresh grace period.
  if (now - lastTick > 5000 || relaysUp()===0) Object.values(roster).forEach(r=> r.lastSeen = now);
  lastTick = now;
  if (now - lastHb >= HEARTBEAT_MS && relaysUp()>0){
    lastHb = now;
    netSend('/all', {t:'hb', session:hostSession, at:hostStartedAt, ver:latestState.ver});
    netSend('/all', {t:'host', session:hostSession, at:hostStartedAt});
  }
  let s = null;
  latestState.players.forEach(p=>{
    const r = roster[p.id];
    if (p.id!==myId && !p.away && (!r || now - r.lastSeen > LOST_AFTER_MS)){
      s = s || clone(latestState);
      const q = s.players.find(x=>x.id===p.id);
      q.away = true; pushLog(s, q.name+' lost connection');
    }
  });
  if (s){ commit(s); return; }
  // Turn timer: act for a player who runs out of time. Two timeouts in a
  // row sits them out until they tap "I'm back".
  if (turnDeadline && now > turnDeadline && isBetting(latestState)){
    const st = clone(latestState);
    const p = st.players[st.turnSeat];
    pushLog(st, `${p.name} ran out of time`);
    const r = applyAction(st, p.id, (st.currentBet - p.bet) > 0 ? 'fold' : 'check');
    if (r.ok){
      p.timeouts = (p.timeouts||0) + 1;
      if (p.timeouts >= 2){ p.sitOut = true; pushLog(r.state, p.name+' is sitting out'); }
      turnDeadline = 0;
      commit(advanceAfterAction(r.state));
    }
  }
}
async function startHosting(code, state){
  hostSession = uid(); hostStartedAt = Date.now();
  roster = {}; hostTurnKey = ''; lastTick = Date.now(); lastHb = 0;
  latestState = state;
  currentCode = code;
  await netOpen(code, base=>[base+'/h', base+'/all'], hostOnMessage);
  if (!await waitForRelay(RELAY_TIMEOUT_MS)){ netClose(); return false; }
  return true;
}

/* ---------- client logic ---------- */
async function startClient(code, name){
  myInbox = uid();
  joinedOnce = false; knownHostSession = null; hostLastSeen = 0;
  currentCode = code; myName = name; latestState = null;
  await netOpen(code, base=>[base+'/p/'+myInbox, base+'/all'], clientOnMessage);
  if (!await waitForRelay(RELAY_TIMEOUT_MS)){
    netClose();
    return failJoin("Can't reach the game servers. Check your internet connection and try again.");
  }
  sendJoin();
  clearTimeout(joinTimer);
  joinTimer = setTimeout(()=>{
    if (!joinedOnce) failJoin(`No table "${code}" is open right now. Check the code, and ask the host to keep the game open on their screen.`);
  }, JOIN_TIMEOUT_MS);
  // The host may have just missed the first message; ask again a few times.
  [3000, 7000, 11000].forEach(ms=> setTimeout(()=>{ if (!joinedOnce && net) sendJoin(); }, ms));
}
function sendJoin(){ netSend('/h', {t:'join', from:myId, name:myName, inbox:myInbox}); }
function failJoin(msg){
  clearTimeout(joinTimer);
  netClose();
  currentCode = null;
  setLobbyMsg(msg);
  setLobbyStatus('Ready', 'ok');
  resetLobbyButtons();
  store.del('ff_seat', true);
}
function clientOnMessage(sub, msg){
  if (isHost) return;
  const now = Date.now();
  if (msg.t==='state' && sub.startsWith('/p/')){
    hostLastSeen = now;
    const st = msg.state;
    if (!st || !Array.isArray(st.players)) return;
    // Ignore an older (or repeated) state that arrived through the slower relay.
    if (latestState && joinedOnce && msg.session===knownHostSession && (st.ver||0) <= (latestState.ver||0)) return;
    knownHostSession = msg.session;
    latestState = st;
    turnDeadline = msg.turnLeft==null ? 0 : now + msg.turnLeft;
    if (!joinedOnce){
      joinedOnce = true; clearTimeout(joinTimer);
      resetLobbyButtons();
      enterTable(currentCode, false);
    } else render();
    updateNetStatus();
    return;
  }
  if (msg.t==='error'){ toast(msg.message, 'error'); return; }
  if (msg.t==='rejected'){ if (!joinedOnce) failJoin(msg.message); return; }
  if (msg.t==='kicked'){ leaving = true; toast('The host removed you from the table', 'info'); netClose(); backToLobby(); return; }
  if (sub==='/all'){
    if (msg.t==='closed' && joinedOnce){ leaving = true; toast('The host closed the table', 'info'); netClose(); backToLobby(); return; }
    if (msg.t==='hb'){
      hostLastSeen = now;
      if (joinedOnce && latestState && (msg.session!==knownHostSession || msg.ver!==latestState.ver)) sendPing(true);
      updateNetStatus();
    }
  }
}
function sendPing(force){
  lastPing = Date.now();
  netSend('/h', {t: force ? 'sync' : 'ping', from:myId, name:myName, inbox:myInbox, ver: latestState && latestState.ver});
  if (force) netSend('/h', {t:'ping', from:myId, name:myName, inbox:myInbox, ver: -1});
}
function clientTickLoop(){
  if (isHost || !joinedOnce || !net) return;
  const now = Date.now();
  if (now - lastPing >= HEARTBEAT_MS && relaysUp()>0) sendPing(false);
  updateNetStatus();
}
setInterval(()=>{ hostTickLoop(); clientTickLoop(); updateTimers(); }, 500);
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState!=='visible' || !currentCode) return;
  if (isHost) lastTick = 0;            // forces the grace period above
  else if (joinedOnce){ hostLastSeen = Date.now(); sendPing(true); }
});

function showConnBar(msg, spinning){ el('connMsg').textContent = msg; el('connSpin').style.display = spinning ? '' : 'none'; el('connBar').classList.add('show'); }
function hideConnBar(){ el('connBar').classList.remove('show'); }
function updateNetStatus(){
  if (!currentCode || el('table').style.display!=='flex') return;
  const up = relaysUp();
  let cls = 'ok', title = isHost ? 'Online — friends can join' : 'Connected to host';
  if (!net || up===0){ cls = 'warn'; title = 'Reconnecting to the game server…'; showConnBar("Reconnecting to the game server… check your internet connection.", true); }
  else if (!isHost && Date.now() - hostLastSeen > LOST_AFTER_MS){
    cls = 'bad'; title = 'Host not responding';
    showConnBar("The host isn't responding. Ask them to open the game again — you'll reconnect automatically.", true);
  } else hideConnBar();
  el('netDot').className = 'dot '+cls;
  el('roomChip').title = title + ' · tap to copy invite';
}

/* ---------- requests from the UI ---------- */
function send(msg){
  if (isHost){ hostDispatch(myId, msg); return; }
  if (!relaysUp()){ toast('Not connected — reconnecting…', 'error'); return; }
  msg.from = myId;
  netSend('/h', msg);
}
function requestStart(){ send({t:'start'}); }
// After you act, the buttons stay locked until the host's next update
// arrives, so a double tap can't send the move twice.
let pendingVer = null, pendingTimer = null;
function requestAction(type, amount){
  raiseUI = null;
  if (!isHost){
    pendingVer = latestState && latestState.ver;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(()=>{ pendingVer = null; render(); }, 5000);
  }
  send({t:'action', action:type, amount});
  if (!isHost) render();
}
function requestRebuy(){ send({t:'rebuy'}); }
function requestShow(which){ send({t:'show', which}); }
function requestAward(pot, winners){ awardSel = null; send({t:'award', pot, winners}); }
function requestSitOut(on){ send({t: on ? 'sitout' : 'back'}); }
function hostKick(pid, name){
  if (!isHost || isBetting(latestState)) return;
  if (confirm(`Remove ${name} from the table?`)) hostDispatch(myId, {t:'kick', target:pid});
}

/* ---------- lobby actions ---------- */
function readName(){
  const name = cleanName(el('nameInput').value);
  if (!el('nameInput').value.trim()){ setLobbyMsg('Enter your name first'); el('nameInput').focus(); return null; }
  return name;
}
function libOk(){
  if (window.mqtt && window.crypto && crypto.subtle) return true;
  setLobbyMsg(!window.mqtt ? 'The game could not load its networking code. Check your connection and reload the page.'
    : 'This page must be opened over https:// to play online.');
  return false;
}
function readSettings(){
  const v = id=> Number(el(id).value);
  const [sb, bb] = el('setBlinds').value.split('/').map(Number);
  const opts = {startChips: v('setChips'), smallBlind: sb, bigBlind: bb, turnSecs: v('setTimer'), mode: gameMode};
  store.set('ff_settings', JSON.stringify(opts));

}
async function hostTable(){
  setLobbyMsg('');
  const name = readName(); if (!name || !libOk()) return;
  setBusy(el('hostBtn'), true, 'Opening table…');
  setLobbyStatus('Connecting to the game server…', 'warn');
  isHost = true; leaving = false; myName = name;
  store.set('felt_fortune_name', name);
  const code = randomCode();
  const state = addPlayer(newTable(code, readSettings()), myId, name);
  if (!await startHosting(code, state)){
    isHost = false; currentCode = null; latestState = null;
    setLobbyMsg("Couldn't reach the game servers. Check your internet connection and try again.");
    setLobbyStatus('Ready', 'ok'); resetLobbyButtons();

  }

}
async function resumeHosting(){
  setLobbyMsg('');
  const saved = store.json('ff_host_save');
  if (!saved || !saved.state){ setLobbyMsg('Nothing to resume'); return; }
  if (!libOk()) return;
  setBusy(el('resumeBtn'), true, 'Reopening…');
  isHost = true; leaving = false;
  myId = saved.hostId || myId; store.set('ff_pid', myId, true);
  myName = saved.name || cleanName(el('nameInput').value);
  const s = saved.state;
  // Everyone else counts as away until their page checks in again (automatic).
  s.players.forEach(p=>{ if (p.id!==myId) p.away = true; });
  pushLog(s, 'Table reopened by the host');
  if (!await startHosting(saved.code, s)){
    isHost = false; currentCode = null; latestState = null;
    setLobbyMsg("Couldn't reach the game servers. Check your internet connection and try again.");
    resetLobbyButtons();
    return;
  }
  resetLobbyButtons();
  enterTable(saved.code, true);
  commit(latestState);
}
async function joinTable(){
  setLobbyMsg('');
  const name = readName(); if (!name) return;
  const code = el('codeInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length!==5){ setLobbyMsg('Room codes are 5 letters/numbers'); el('codeInput').focus(); return; }
  if (!libOk()) return;
  setBusy(el('joinBtn'), true, 'Joining…');
  setLobbyStatus('Looking for table '+code+'…', 'warn');

}
function manualReconnect(){
  if (!currentCode) return;
  if (isHost){ toast('Reconnecting…'); netClose(); startHosting(currentCode, latestState).then(ok=>{ if (ok) commit(latestState); }); }
  else { hostLastSeen = Date.now(); sendPing(true); toast('Checking in with the host…'); }
}
function leaveTable(){
  if (isHost){
    const others = latestState ? latestState.players.filter(p=>p.id!==myId && !p.away).length : 0;
    if (others && !confirm('Close this table for everyone? Your friends will be disconnected.')) return;
    netSend('/all', {t:'closed'});
    clearHostSnapshot();
  } else {
    if (!confirm('Leave this table?')) return;
    send({t:'leave'});
  }
  leaving = true;
  const n = net; net = null;
  setTimeout(()=>{ if (n){ n.closed = true; n.clients.forEach(c=>{ try{ c.end(); }catch(e){} }); } }, 600);
  backToLobby();
}
function backToLobby(){
  store.del('ff_seat', true);
  clearTimeout(joinTimer);
  isHost = false; currentCode = null; latestState = null; roster = {}; joinedOnce = false; turnDeadline = 0;
  history.replaceState(null, '', location.pathname + location.search);
  el('table').style.display = 'none';
  el('lobby').style.display = 'flex';

}
function inviteUrl(){ return location.origin + location.pathname + '#room=' + currentCode; }
async function shareInvite(preferShare){

    try{ await navigator.share({title:'Felt & Fortune', text:`Join my poker table — room code ${currentCode}`, url}); return; }catch(e){ if (e && e.name==='AbortError') return; }
  }

// Live countdowns for the turn timer.

/* ---------- rendering ---------- */
let seenCards = new Set();
let raiseUI = null;        // {key, min, max, value}
let wasMyTurn = false;
let lastHandNum = -1;
let lastFelt = null;
let awardSel = null;       // {key, ids:Set} — winners being picked for the current pot
let gameMode = 'cards';    // lobby choice for a new table

function hueFor(name){ let h = 0; for (const ch of String(name)) h = (h*31 + ch.charCodeAt(0)) % 360; return h; }

function cardEl(code, opts){

  d.innerHTML = `<div class="ix">${rank}<i>${sym}</i></div><div class="pip">${sym}</div>`;
  d.setAttribute('aria-label', `${rank} of ${{S:'spades',H:'hearts',D:'diamonds',C:'clubs'}[suit]}`);
  if (opts.key && !seenCards.has(opts.key)){ seenCards.add(opts.key); d.classList.add('deal'); }

// Which 5 cards make the best hand, for highlighting at showdown.
function bestFive(cards){
  let best=null, bestC=null;
  for (const c of combinations(cards, 5)){ const sc = score5(c); if (!best || compareScores(sc,best)>0){ best=sc; bestC=c; } }
  return bestC || [];
}
function preflopLabel(cards){
  const [a,b] = cards.map(c=>rankVal(c[0])).sort((x,y)=>y-x);
  const short = v=> v===10 ? '10' : RANKS[v-2];
  if (a===b) return `Pocket ${rankName(a,true)}`;
  return `${short(a)}-${short(b)} ${cards[0][1]===cards[1][1] ? 'suited' : 'offsuit'}`;
}

function render(){
  if (!currentCode) return;
  const s = isHost ? (latestState && viewFor(myId, latestState)) : latestState;
  if (!s){
    el('centerArea').innerHTML = '<div class="stage-label">Waiting for table data…</div>';
    return;
  }
  if (s.handNum!==lastHandNum){ seenCards = new Set(); lastHandNum = s.handNum; }
  renderLog(s);
  renderLedger(s);
  el('gameInfo').innerHTML = '';
  const gi = el('gameInfo');
  gi.append(s.mode==='chips' ? 'Real cards' : "Hold'em");
  const gb = document.createElement('b'); gb.textContent = `${fmt(s.smallBlind)} / ${fmt(s.bigBlind)}`; gi.appendChild(gb);

  const myIndex = s.players.findIndex(p=>p.id===myId);
  const me = myIndex>=0 ? s.players[myIndex] : null;
  const betting = isBetting(s);
  const myTurn = betting && me && s.turnSeat===myIndex;
  if (myTurn && !wasMyTurn){
    try{ if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([40,40,40]); }catch(e){}
    if (document.hidden) document.title = '● Your turn — Felt & Fortune';
  }
  if (!myTurn) document.title = 'Felt & Fortune — Poker Night';
  wasMyTurn = myTurn;

  const winners = new Set(s.winners||[]);
  let highlight = new Set();
  if (s.stage==='showdown' && s.community.length===5){
    s.players.filter(p=>winners.has(p.id) && p.revealedHand).forEach(p=>{
      bestFive([...p.cards, ...s.community]).forEach(c=>highlight.add(c));
    });
  }

  // Hero and controls first: they change how much height the felt gets.
  renderHero(s, me, myIndex, highlight, winners);
  renderActions(s, me, myIndex);
  lastFelt = {s, me, myIndex, highlight, winners, betting};
  renderFelt();
  updateTimers();
}
function renderFelt(){

      center.appendChild(hint);
    }
    const livePot = s.players.reduce((sum,p)=>sum+p.totalBet,0);
    const streetBets = s.players.reduce((sum,p)=>sum+p.bet,0);
    if (betting){
      const pot = document.createElement('div'); pot.className='pot';
      pot.appendChild(chipIco());

      pot.appendChild(document.createTextNode(fmt(livePot - streetBets)));

      center.appendChild(pot);
    } else if (s.stage==='award' && s.pots){

    if (s.winnerMsg && !betting){
      const wb = document.createElement('div'); wb.className='winner-banner'; wb.textContent = '🏆 ' + s.winnerMsg;

  }

// Spread seats evenly by distance along the table edge (not by angle), so a
// tall phone-shaped table doesn't bunch players up at the top and bottom.
// With you at the bottom, everyone else fans out clockwise from your left.
function seatAngles(m, hasHero, rx, ry, tall){
  // On tall phone screens keep seats around the top so the board has room below.
  const a0 = hasHero ? (tall ? 162 : 135) : 90, a1 = hasHero ? (tall ? 378 : 405) : 450;
  const N = 360, pts = [0];
  let prevX = rx*Math.cos(a0*Math.PI/180), prevY = ry*Math.sin(a0*Math.PI/180);
  for (let i=1;i<=N;i++){
    const t = (a0 + (a1-a0)*i/N)*Math.PI/180, x = rx*Math.cos(t), y = ry*Math.sin(t);
    pts.push(pts[i-1] + Math.hypot(x-prevX, y-prevY)); prevX = x; prevY = y;
  }
  const L = pts[N], out = [];
  for (let k=0;k<m;k++){
    const target = hasHero ? L*(k+0.5)/m : L*k/m;
    let i = 1; while (i<N && pts[i] < target) i++;
    out.push((a0 + (a1-a0)*i/N)*Math.PI/180);
  }
  return out;
}
function seatTag(s, p, winners){
  if (p.away) return {text: isHost && !isBetting(s) ? 'away · tap to remove' : 'away', cls:'red'};
  if (p.sitOut && !(isBetting(s) && p.inHand && !p.folded)) return {text:'sitting out'};
  if (s.stage==='showdown' && winners.has(p.id)) return {text: p.revealedHand ? p.revealedHand : 'winner', cls:'gold'};
  if (s.stage==='showdown' && p.revealedHand) return {text:p.revealedHand};
  if (p.allIn && p.inHand && !p.folded) return {text:'all in', cls:'gold'};
  if (p.inHand && p.folded) return {text:'fold'};
  if (isBetting(s) && !p.inHand) return {text: p.chips>0 ? 'next hand' : 'busted'};
  if (!isBetting(s) && p.chips===0) return {text:'busted', cls:'red'};
  return null;
}

  const left = document.createElement('div'); left.className='hero-me';

  }
  else if (s.mode==='chips' && me.inHand && !me.folded && isBetting(s)) { hand.textContent = 'Your real cards'; }
  else if (isBetting(s) && !me.inHand) sub.textContent = 'Dealt in next hand';
  else if (isBetting(s) && s.turnSeat===myIndex){
    const toCall = s.currentBet - me.bet;
    sub.textContent = toCall>0 ? `${fmt(Math.min(toCall, me.chips))} to call ` : 'Your move ';
    sub.style.color = 'var(--gold)';
    const tm = document.createElement('span'); tm.className='timer'; tm.dataset.timer='1'; sub.appendChild(tm);
  }

function renderActions(s, me, myIndex){
  const area = el('controls');
  area.innerHTML = '';
  const betting = isBetting(s);

  if (me && me.sitOut && !(betting && me.inHand && !me.folded)){
    const row = document.createElement('div'); row.className='center-row';
    const b = document.createElement('button'); b.className='btn btn-gold'; b.textContent="I'm back, deal me in";
    b.onclick = ()=>requestSitOut(false); row.appendChild(b);
    area.appendChild(row);
    const note=document.createElement('div'); note.className='wait-note'; note.textContent="You're sitting out, so you won't be dealt in.";
    area.appendChild(note);
    return;
  }
  if (s.stage==='award' && s.pots){
    renderAward(area, s, me);

  }
  if (s.stage==='showdown' && me && me.inHand && me.cards && me.cards.length===2 && me.cards[0]!=='XX' && !me.revealedHand){

      const note=document.createElement('div'); note.className='wait-note';

      area.appendChild(note);
    }
    return;
  }
  if (!me || !me.inHand || me.folded || me.allIn){
    const note=document.createElement('div'); note.className='wait-note';
    const tp = s.players[s.turnSeat];
    note.innerHTML = '';
    const lead = me && me.allIn && me.inHand ? "You're all in. " : (me && me.folded && me.inHand ? 'You folded. ' : (me && !me.inHand ? "You'll be dealt in next hand. " : ''));

    if (tp){ const b=document.createElement('b'); b.textContent=tp.name; note.appendChild(b); const tm=document.createElement('span'); tm.className='timer'; tm.dataset.timer='1'; note.appendChild(tm); }
    area.appendChild(note);

  }
  if (s.turnSeat !== myIndex){

    const note=document.createElement('div'); note.className='wait-note';

    const b=document.createElement('b'); b.textContent = tp ? tp.name : '…'; note.appendChild(b);
    const tm=document.createElement('span'); tm.className='timer'; tm.dataset.timer='1'; note.appendChild(tm);
    area.appendChild(note);
    return;
  }

  if (pendingVer!=null && pendingVer===s.ver){
    const note=document.createElement('div'); note.className='wait-note';
    note.innerHTML = '<span class="spinner"></span>Sending…';
    area.appendChild(note);
    return;
  }
  const toCall = s.currentBet - me.bet;
  const maxBet = me.bet + me.chips;
  const minTarget = Math.min(maxBet, s.currentBet + s.minRaise);
  const canRaise = me.chips > Math.max(0, toCall);
  const pot = s.players.reduce((sum,p)=>sum+p.totalBet,0);
  const key = `${s.handNum}-${s.stage}-${s.currentBet}-${me.bet}`;
  if (raiseUI && raiseUI.key!==key) raiseUI = null;

  if (raiseUI){
    const panel = document.createElement('div'); panel.className='raise-panel';
    const top = document.createElement('div'); top.className='raise-top';
    top.innerHTML = `<span class="k">${s.currentBet===0 ? 'Bet' : 'Raise to'}</span>`;
    const amt = document.createElement('span'); amt.className='raise-amt'; top.appendChild(amt);
    panel.appendChild(top);
    const slider = document.createElement('input'); slider.type='range';
    slider.min = minTarget; slider.max = maxBet; slider.step = 1; slider.value = raiseUI.value;
    slider.setAttribute('aria-label','Raise amount');
    panel.appendChild(slider);
    const presets = document.createElement('div'); presets.className='presets';
    const confirmBtn = document.createElement('button'); confirmBtn.className='btn btn-gold';
    const sync = ()=>{
      const v = raiseUI.value;

      slider.value = v;
      slider.style.setProperty('--pct', maxBet>minTarget ? ((v-minTarget)/(maxBet-minTarget)*100)+'%' : '100%');
      confirmBtn.textContent = v>=maxBet ? `All in ${fmt(maxBet)}` : `${s.currentBet===0?'Bet':'Raise to'} ${fmt(v)}`;
    };
    const setVal = v=>{ raiseUI.value = Math.max(minTarget, Math.min(maxBet, Math.round(v))); sync(); };
    slider.oninput = ()=> setVal(Number(slider.value));
    [['Min', ()=>minTarget], ['½ Pot', ()=>s.currentBet + 0.5*(pot+toCall)], ['¾ Pot', ()=>s.currentBet + 0.75*(pot+toCall)], ['Pot', ()=>s.currentBet + (pot+toCall)], ['Max', ()=>maxBet]]
      .forEach(([lbl, fn])=>{ const b=document.createElement('button'); b.textContent=lbl; b.onclick=()=>setVal(fn()); presets.appendChild(b); });
    panel.appendChild(presets);
    area.appendChild(panel);
    const row = document.createElement('div'); row.className='row';
    const cancel = document.createElement('button'); cancel.className='btn btn-ghost'; cancel.textContent='Cancel';
    cancel.onclick = ()=>{ raiseUI = null; render(); };
    confirmBtn.onclick = ()=>{
      const v = raiseUI.value;
      if (v>=maxBet) requestAction('allin');
      else requestAction(s.currentBet===0 ? 'bet' : 'raise', v);
    };
    row.appendChild(cancel); row.appendChild(confirmBtn);
    area.appendChild(row);
    sync();
    return;
  }

  const row = document.createElement('div'); row.className='row action-row';
  const mk = (cls, text, sub, kbd, fn)=>{
    const b = document.createElement('button'); b.className='btn '+cls;
    const t = document.createElement('span'); t.textContent = text; b.appendChild(t);
    if (sub){ const sm=document.createElement('small'); sm.textContent=sub; b.appendChild(sm); }

  };
  mk('btn-fold', 'Fold', null, 'F', ()=>requestAction('fold'));
  if (toCall<=0) mk('btn-call', 'Check', null, 'C', ()=>requestAction('check'));
  else if (toCall >= me.chips) mk('btn-call', 'Call all in', fmt(me.chips), 'C', ()=>requestAction('call'));

  if (canRaise){

  }
  area.appendChild(row);
}
