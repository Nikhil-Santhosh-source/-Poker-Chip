  const go = document.createElement('button'); go.className='btn btn-gold';
  const picked = [...awardSel.ids];
  const pickedNames = picked.map(id=> (s.players.find(x=>x.id===id)||{}).name);
  go.textContent = !picked.length ? 'Pick the winner' : picked.length===1 ? `Give ${fmt(pot.amount)} to ${pickedNames[0]}` : `Split ${fmt(pot.amount)} between ${picked.length}`;
  go.disabled = !picked.length || !me || me.away;
  go.onclick = ()=>requestAward(idx, picked);
  row.appendChild(go);
  area.appendChild(row);
}
function renderLedger(s){
  const body = el('ledgerBody');
  const start = s.startChips || START_CHIPS;
  const rows = s.players.map(p=>{
    const inPlay = (p.totalBet||0);
    const net = p.chips + inPlay - start*(p.buyIns||1);
    return {p, net, buy: start*(p.buyIns||1), stack: p.chips + inPlay};
  }).sort((a,b)=>b.net-a.net);
  const t = document.createElement('table'); t.className='ledger';
  t.innerHTML = '<thead><tr><th>Player</th><th>Buy-in</th><th>Stack</th><th>Net</th></tr></thead>';
  const tb = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const td = (txt, cls)=>{ const d=document.createElement('td'); d.textContent=txt; if (cls) d.className=cls; tr.appendChild(d); };
    td(r.p.name + (r.p.id===myId ? ' (you)' : '') + (r.p.away ? ' · away' : ''));
    td(fmt(r.buy)); td(fmt(r.stack));
    td((r.net>0?'+':'') + fmt(r.net), r.net>0 ? 'up' : r.net<0 ? 'down' : '');
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  body.innerHTML = '';
  body.appendChild(t);
  const note = document.createElement('p');
  note.style.cssText = 'font-size:12px;color:var(--text-faint);margin-top:14px;line-height:1.5';
  note.textContent = `Everyone buys in for ${fmt(start)}. Rebuys add another ${fmt(start)} to your buy-in. Blinds ${fmt(s.smallBlind)}/${fmt(s.bigBlind)}.`;
  body.appendChild(note);
}
function dealBtn(s, eligibleCount){
  const b = document.createElement('button'); b.className='btn btn-gold';
  b.textContent = s.handNum>0 ? 'Deal next hand' : 'Deal first hand';
  b.disabled = eligibleCount<2;
  b.onclick = requestStart;
  return b;
}
function renderLog(s){
  const body = el('logBody');
  body.innerHTML = '';
  s.log.slice().reverse().forEach(line=>{
    const d = document.createElement('div'); d.textContent = line;
    if (line.startsWith('—')) d.className='street';
    else if (line.startsWith('Hand #')) d.className='hand';
    else if (/ wins /.test(line)) d.className='win';
    body.appendChild(d);
  });
}

/* ---------- wiring ---------- */
function selectTab(join){
  el('tabHost').setAttribute('aria-selected', String(!join));
  el('tabJoin').setAttribute('aria-selected', String(join));
  el('paneHost').classList.toggle('on', !join);
  el('paneJoin').classList.toggle('on', join);
  setLobbyMsg('');
}
function openLog(open){ el('logDrawer').classList.toggle('open', open); el('scrim').classList.toggle('show', open); }
function refreshResumeBox(){
  const saved = store.json('ff_host_save');
  const invite = location.hash.match(/room=([A-Z0-9]{5})/i);
  if (saved && saved.code && saved.state && !(invite && invite[1].toUpperCase()!==saved.code)){
    const others = saved.state.players.length - 1;
    el('resumeHint').textContent = `You were hosting table ${saved.code}${others>0 ? ` with ${others} other player${others>1?'s':''}` : ''}. Reopen it and their pages will reconnect automatically.`;
    el('resumeBox').style.display = 'block';
  } else el('resumeBox').style.display = 'none';
}
el('tabHost').addEventListener('click', ()=>selectTab(false));
function setMode(m){
  gameMode = m==='chips' ? 'chips' : 'cards';
  el('modeCards').setAttribute('aria-pressed', String(gameMode==='cards'));
  el('modeChips').setAttribute('aria-pressed', String(gameMode==='chips'));
}
el('modeCards').addEventListener('click', ()=>setMode('cards'));
el('modeChips').addEventListener('click', ()=>setMode('chips'));
function drawerTab(ledger){
  el('tabLog').setAttribute('aria-selected', String(!ledger));
  el('tabLedger').setAttribute('aria-selected', String(ledger));
  el('logBody').style.display = ledger ? 'none' : '';
  el('ledgerBody').style.display = ledger ? '' : 'none';
}
el('tabLog').addEventListener('click', ()=>drawerTab(false));
el('tabLedger').addEventListener('click', ()=>drawerTab(true));
function setFourColor(on){
  document.body.classList.toggle('four', on);
  el('fourColor').setAttribute('aria-checked', String(on));
  store.set('ff_four', on ? '1' : '0');
}
el('fourColor').addEventListener('click', ()=>setFourColor(el('fourColor').getAttribute('aria-checked')!=='true'));
el('tabJoin').addEventListener('click', ()=>selectTab(true));
el('hostBtn').addEventListener('click', hostTable);
el('joinBtn').addEventListener('click', joinTable);
el('resumeBtn').addEventListener('click', resumeHosting);
el('discardBtn').addEventListener('click', ()=>{ clearHostSnapshot(); refreshResumeBox(); });
el('reconnectBtn').addEventListener('click', manualReconnect);
el('leaveBtn').addEventListener('click', leaveTable);
el('codeInput').addEventListener('input', e=>{ e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
el('codeInput').addEventListener('keydown', e=>{ if (e.key==='Enter') joinTable(); });
el('nameInput').addEventListener('keydown', e=>{ if (e.key==='Enter') (el('paneJoin').classList.contains('on') ? joinTable : hostTable)(); });
el('logBtn').addEventListener('click', ()=>openLog(true));
el('closeLogBtn').addEventListener('click', ()=>openLog(false));
el('scrim').addEventListener('click', ()=>openLog(false));
el('roomChip').addEventListener('click', ()=>shareInvite(false));
el('inviteBtn').addEventListener('click', ()=>shareInvite(true));
new ResizeObserver(()=>renderFelt()).observe(el('feltWrap'));
window.addEventListener('beforeunload', e=>{
  if (isHost && latestState && latestState.players.some(p=>p.id!==myId && !p.away)){ e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('keydown', e=>{
  if (!currentCode || e.target.tagName==='INPUT' && e.target.type!=='range' || e.metaKey || e.ctrlKey || e.altKey) return;
  const btns = [...el('controls').querySelectorAll('button')];
  const find = t=> btns.find(b=>b.textContent.trim().toLowerCase().startsWith(t));
  const k = e.key.toLowerCase();
  let b = null;
  if (k==='escape'){ if (el('logDrawer').classList.contains('open')) openLog(false); else b = find('cancel'); }
  else if (k==='f') b = find('fold');
  else if (k==='c') b = find('check') || find('call');
  else if (k==='r' || k==='b') b = find('raise') || find('bet') || find('all in');
  else if (k==='enter') b = el('controls').querySelector('.btn-gold');
  else if (k==='l') openLog(!el('logDrawer').classList.contains('open'));
  if (b && !b.disabled){ e.preventDefault(); b.click(); }
});

(function init(){
  const savedName = store.get('felt_fortune_name');
  if (savedName) el('nameInput').value = savedName;
  const m = location.hash.match(/room=([A-Z0-9]{5})/i);
  if (m){ el('codeInput').value = m[1].toUpperCase(); selectTab(true); }
  refreshResumeBox();
  const st = store.json('ff_settings');
  if (st){
    if (st.startChips) el('setChips').value = String(st.startChips);
    if (st.bigBlind) el('setBlinds').value = st.smallBlind+'/'+st.bigBlind;
    if (st.turnSecs!=null) el('setTimer').value = String(st.turnSecs);
    if (st.mode) setMode(st.mode);
  }
  setFourColor(store.get('ff_four')==='1');
  if (!window.mqtt){
    setLobbyStatus('Could not load the networking library — check your connection and reload.', 'bad');
  } else {
    setLobbyStatus(m ? `Invite for table ${m[1].toUpperCase()} — enter your name and join` : 'Ready', 'ok');
  }
  (savedName ? (m ? el('joinBtn') : el('hostBtn')) : el('nameInput')).focus({preventScroll:true});
  // Reloading the page while seated drops you straight back into your seat.
  let seat = null; try{ seat = JSON.parse(store.get('ff_seat', true)); }catch(e){}
  if (seat && m && seat.code===m[1].toUpperCase() && window.mqtt){
    el('nameInput').value = seat.name;
    joinTable();
  }
})();
</script>
